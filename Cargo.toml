[package]
name = "gametools"
version = "0.11.0"
authors = ["pygmy-twylyte <davidjvbrown.md@gmail.com>"]
edition = "2024"
description = "Toolkit for game-building in Rust: cards, dice, dominos, grids, FOV, pathfinding, spinners, pools, resources, and ordering helpers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pygmy-twylyte/gametools"
readme = "README.md"
keywords = ["games", "dice", "dominos", "cards", "spinners"]
categories = ["game-engines", "data-structures"]


[dependencies]
rand = "0.9.0"
strum = "0.27.1"
strum_macros = "0.27.1"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0.18"
bytecount = "0.6.9"
smallvec = "1.15.1"
eframe = { version = "0.34.3", optional = true }

[dependencies.uuid]
version = "1.18.1"
# Lets you generate random UUIDs
features = [
    "v4",
    "serde",
]

[features]
serde = ["dep:serde"]
fov-egui = ["dep:eframe"]
default = []

[[example]]
name = "fov"
path = "examples/fov/main.rs"
required-features = ["fov-egui"]

[package.metadata.tarpaulin]
exclude-files = ["src/bin/scratch.rs"]

[dev-dependencies]
colored = "3"
